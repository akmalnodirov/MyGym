<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyGym</title>
    <!--
      Telegram requires the Mini App runtime to be loaded from its own origin; there is no npm
      equivalent that Telegram supports. This is the only external script the app loads. It defines
      window.Telegram.WebApp, which src/telegram/runtime.ts is the sole consumer of.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
