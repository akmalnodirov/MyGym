name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Testcontainers starts PostgreSQL itself; the Docker daemon on the runner is enough.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'

      # Minor fix-before-merge item 9: the Dockerfile has never actually been executed anywhere —
      # not in CI, and not locally, since Docker cannot start on the implementer's machine (WSL
      # reboot pending). This is the one unexecuted artefact a reboot on that machine will not
      # validate either, so it has to be proven here instead.
      - name: Build Docker image
        run: docker build -t mygym-api:ci .

  mini-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mini-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/mini-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # openapi.json and src/api/generated.ts are committed so the client can be typechecked without a
  # .NET SDK. The cost of committing generated files is that they can go stale, so this job
  # regenerates both and fails on any diff -- turning staleness into a red build rather than a
  # runtime surprise in a gym.
  contract-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/mini-app/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: clients/mini-app

      # Needs no database: the document comes from endpoint metadata, and the script starts the
      # host with migrations disabled and placeholder secrets.
      - name: Regenerate the OpenAPI document
        run: bash scripts/dump-openapi.sh clients/mini-app/openapi.json

      - name: Regenerate the TypeScript types
        run: npm run api:types
        working-directory: clients/mini-app

      - name: Fail if either is out of date
        run: |
          git diff --exit-code -- clients/mini-app/openapi.json clients/mini-app/src/api/generated.ts             || {
              echo "::error::The committed contract is stale. Run scripts/dump-openapi.sh and npm run api:types, then commit the result."
              exit 1
            }
